name: ci

# Platform-independent checks only. Tests that need WASAPI, CUDA, WSL, tkinter or
# Windows counters skip themselves on Linux; nothing here opens a network connection.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Validate the sealed router fixture
        run: python scripts/validate_router_fixture.py
      - name: Privacy scan
        run: python scripts/privacy_scan.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
